<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UI Interaction Kit · 61 个前端交互词条 Demo</title>
<link rel="stylesheet" href="styles.css">
<script src="core.js"></script>
</head>
<body>
<header class="topbar">
  <div class="topbar-main">
    <div class="titles">
      <h1>UI Interaction Kit</h1>
      <p>61 个前端交互与动效词条 · 每个演示都可直接操作 · 原生 JS 无依赖</p>
    </div>
    <div class="controls">
      <input id="search" type="search" placeholder="搜索词条 / 中文名 / 场景" autocomplete="off">
      <label class="switch">
        <input type="checkbox" id="reduced">
        <span>减少动效</span>
      </label>
      <span class="count" id="count"></span>
    </div>
  </div>
  <nav class="catnav" id="catnav"></nav>
</header>

<main id="main"></main>

<footer class="foot">
  分类顺序：质感动效 8 · 图表交互 7 · 高级交互模式 10 · 展开动画 7 · 折叠组件 8 · 导航组件 7 · 弹窗组件 7 · 加载动效 7
  <br>参考 <code>ui-interaction-kit/references/*.md</code> 获取每个词条的选型边界、关键规则与验收清单。
</footer>

<script src="demos/01-motion.js"></script>
<script src="demos/02-chart.js"></script>
<script src="demos/03-patterns.js"></script>
<script src="demos/04-expand.js"></script>
<script src="demos/05-collapse.js"></script>
<script src="demos/06-nav.js"></script>
<script src="demos/07-overlay.js"></script>
<script src="demos/08-loading.js"></script>
</body>
</html>
